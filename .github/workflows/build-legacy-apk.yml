name: Build APK (Android 5+)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: |
          mkdir app
          unzip -q "$(ls *.zip | head -n 1)" -d app
          if [ ! -f app/package.json ]; then
            inner="$(dirname "$(find app -maxdepth 2 -name package.json | head -n 1)")"
            mv "$inner"/* app/ 2>/dev/null || true
          fi
      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build web
        working-directory: app
        run: npm run build
      - name: Add Android
        working-directory: app
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Lower minimum Android to 5.0
        working-directory: app
        run: |
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 21/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
      - name: App icon
        continue-on-error: true
        working-directory: app
        run: |
          IM=convert
          command -v magick >/dev/null 2>&1 && IM=magick
          RES=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            $IM public/icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            $IM public/icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_round.png
            $IM public/icon-maskable-512.png -resize ${3}x${3} $RES/mipmap-$1/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#111E33</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
      - name: Sync
        working-directory: app
        run: npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show minimum Android version
        continue-on-error: true
        run: |
          AAPT="$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -n 1)"
          "$AAPT" dump badging app/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "sdkVersion|package:"
      - uses: actions/upload-artifact@v4
        with:
          name: qasr-alsadaqa-android5-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
