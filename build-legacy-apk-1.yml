name: Build APK (Android 5+)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: |
          mkdir app
          unzip -q "$(ls *.zip | head -n 1)" -d app
          if [ ! -f app/package.json ]; then
            inner="$(dirname "$(find app -maxdepth 2 -name package.json | head -n 1)")"
            mv "$inner"/* app/ 2>/dev/null || true
          fi
      - name: Install
        working-directory: app
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
      - name: Build web
        working-directory: app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
      - name: Add Android
        working-directory: app
        run: |
          set -o pipefail
          if [ ! -d android ]; then npx cap add android 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"; fi
      - name: Lower minimum Android to 5.0
        working-directory: app
        run: |
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 21/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
      - name: Allow old Android for the file plugin
        working-directory: app
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'overrideLibrary' not in s:
              s = s.replace('<application', '<uses-sdk tools:overrideLibrary="io.ionic.libs.ionfilesystemlib,org.apache.cordova" />\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          head -12 android/app/src/main/AndroidManifest.xml
      - name: App icon
        working-directory: app
        run: |
          if command -v magick >/dev/null 2>&1; then IM=magick
          elif command -v convert >/dev/null 2>&1; then IM=convert
          else echo "ImageMagick not found - keeping the default icon"; exit 0; fi
          RES=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            $IM public/icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png || true
            $IM public/icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_round.png || true
            $IM public/icon-maskable-512.png -resize ${3}x${3} $RES/mipmap-$1/ic_launcher_foreground.png || true
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#111E33</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
      - name: Sync
        working-directory: app
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
      - name: Build APK
        working-directory: app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
      - name: Minimum Android in the built app
        run: |
          find app/android/app/build/intermediates -name AndroidManifest.xml -path "*merged_manifests*" -exec grep -ho 'minSdkVersion="[0-9]*"' {} \; | sort -u || true
      - name: Failure summary
        if: failure()
        run: |
          {
            echo '### سبب الفشل'
            echo '```'
            grep -n -A14 "What went wrong" build.log | head -45 || true
            echo '```'
            echo '### آخر سطور السجل'
            echo '```'
            tail -n 25 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qasr-alsadaqa-android5-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
